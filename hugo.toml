# 起始 URL（换成您自己的域名）
baseURL = 'https://jade-blog.pages.dev'
# 网站标题（含单引号，所以必须用双引号包裹）
title = "J's Blog"
# 每页显示的文章数量
paginate = 5
# 主题名称
theme = 'PaperMod'
# 语言代码（zh-简体中文）
languageCode = 'zh'
DefaultContentLanguage = 'zh'
# 是否有 CJK 语言（中-日-韩）
hasCJKLanguage = true

# 是否生成 robots.txt
enableRobotsTXT = true

# 是否构建草稿
buildDrafts = false
# 是否构建未来的文章
buildFuture = false
# 是否构建过期的文章
buildExpired = false
# 是否启用 Emoji
enableEmoji = true
# 是否启用 Git 信息
enableGitInfo = false

# Google Analytics ID
googleAnalytics = ''

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
# 注意：原 YAML 中此项位于文件末尾，但 TOML 要求所有根级键必须写在第一个表头 [xxx] 之前，
# 否则会被误解析为某个表的键，因此此处上移到顶部，语义不变。
pygmentsUseClasses = true

# 压缩输出静态文件
[minify]
  # 是否不压缩 XML 文件
  disableXML = true
  minifyOutput = true

# 全局配置
[params]
  env = 'production'
  # 网站标题
  title = "J's Blog"
  # 网站描述
  description = 'A personal blog.'
  # 网站关键词（大部分搜索引擎已放弃，可注释掉）
  # keywords = ["Blog", "Portfolio", "PaperMod"]

  # 网站作者
  author = 'J'
  # 多个作者写法
  # author = ["Me", "You"]

  # OpenGraph / Twitter Card 预览图片（/static 下面的文件名称）
  images = ['opengraph.webp']
  # 日期格式
  DateFormat = '2006-01-02'
  # 默认主题
  defaultTheme = 'auto' # dark, light
  # 是否启用主题切换按钮
  disableThemeToggle = false
  # 是否启用阅读时间展示
  ShowReadingTime = false
  # 是否启用分享按钮
  ShowShareButtons = false
  ShowPostNavLinks = false
  # 是否启用面包屑导航
  ShowBreadCrumbs = true
  # 是否显示代码复制按钮
  ShowCodeCopyButtons = true
  # 是否显示字数统计
  ShowWordCount = false
  # 是否在页面显示 RSS 按钮
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  # 是否禁用首页滚动到顶部
  disableScrollToTop = false
  # 是否启用评论系统
  comments = false
  # 是否隐藏 Meta 信息
  hidemeta = false
  # 是否隐藏文章摘要
  hideSummary = false
  # 是否显示目录
  showtoc = true
  # 是否默认展开文章目录
  tocopen = false

[params.assets]
  # disableHLJS = true # to disable highlight.js
  # disableFingerprinting = true

  # 网站 Favicon 图标相关信息
  # 可在 https://realfavicongenerator.net/ 生成
  # 将图片复制到 /static 目录下
  # 然后修改下面代码中的文件名
  favicon = 'web_icon.png'
  favicon16x16 = 'web_icon.png'
  favicon32x32 = 'web_icon.png'
  apple_touch_icon = 'apple_touch_icon.png'
  safari_pinned_tab = 'apple_touch_icon.png'

[params.label]
  # 使用文本替代 Logo 标签
  text = "J's Blog"
  # 网站 Logo 图片（/static 下面的文件名称）
  icon = '/web_icon.png'
  # 图标高度
  iconHeight = 35

# 主页展示模式
# 个人信息模式
[params.profileMode]
  enabled = false # needs to be explicitly set
  title = 'ExampleSite'
  subtitle = 'This is subtitle'
  imageUrl = '<img location>'
  imageWidth = 120
  imageHeight = 120
  imageTitle = 'my image'

[[params.profileMode.buttons]]
  name = 'Posts'
  url = 'posts'

[[params.profileMode.buttons]]
  name = 'Tags'
  url = 'tags'

# 主页 - 信息模式（默认）
[params.homeInfoParams]
  Title = "J's Blog"
  Content = '以此 谨记我落差的生活'

#  主页 - 信息模式 图标展示
# [[params.socialIcons]]
#   name = 'bilibili'
#   url = 'https://space.bilibili.com/181838840'

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/InitialJ0614'

[[params.socialIcons]]
  name = 'bilibili'
  url = 'https://space.bilibili.com/181838840'

# 站长验证
[params.analytics.google]
  SiteVerificationTag = ''

[params.analytics.bing]
  SiteVerificationTag = ''

[params.analytics.yandex]
  SiteVerificationTag = ''

# 文章封面设置
[params.cover]
  hidden = false # hide everywhere but not in structured data
  hiddenInList = true # hide on list pages and home
  hiddenInSingle = true # hide on single page

# 关联编辑
[params.editPost]
 # URL = 'https://github.com/DejavuMoe/hugo-start/edit/master/content/posts'
 # Text = '' # edit text
 #12:27 2026/9/5 appendFilePath = true # to append file path to Edit link

# for search
# https://fusejs.io/api/options.html
[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ['title', 'permalink', 'summary', 'content']

# 顶部导航栏
[[menu.main]]
  identifier = '首页'
  name = '首页'
  url = '/'
  weight = 1

[[menu.main]]
  identifier = '分类'
  name = '分类'
  url = '/categories/'
  weight = 10

[[menu.main]]
  identifier = '标签'
  name = '标签'
  url = '/tags/'
  weight = 20

[[menu.main]]
  identifier = '浮生碎笔'
  name = '浮生碎笔'
  url = '/diaries/'
  weight = 11

[[menu.main]]
  identifier = '活在仙交'
  name = '活在仙交'
  url = '/things_in_xjtu/'
  weight = 12

[markup]
  [markup.highlight]
    noClasses = false
    # anchorLineNos = true
    # codeFences = true
    # guessSyntax = true
    # lineNos = true
    # style = 'monokai'

[privacy]
  [privacy.vimeo]
    disabled = true
    enableDNT = true
    simple = true

  [privacy.twitter]
    disabled = true
    enableDNT = true # 是否启用添加“请勿跟踪” HTTP 头。
    simple = true # 如果启用简单模式，将建立一个静态的、无 JS 版本的推文。

  [privacy.instagram]
    disabled = true
    simple = true

  [privacy.youtube]
    disabled = true
    privacyEnhanced = true

[services]
  [services.instagram]
    disableInlineCSS = true # 禁用 Hugo 提供的内联样式

  [services.twitter]
    disableInlineCSS = true # 禁用 Hugo 提供的内联样式
